spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:insightpest_db}
    driverClassName: org.postgresql.Driver
    username: ${DB_USERNAME:insightpest_user}
    password: ${DB_PASSWORD:insightpest_secure_pass}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    com.insightpest: INFO
    org.springframework.web: WARN
